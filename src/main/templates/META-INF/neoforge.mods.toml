modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/crabsatellite/Urushi-MOD-1.21.1-Neoforge/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/crabsatellite/Urushi-MOD-1.21.1-Neoforge"
updateJSONURL="https://raw.githubusercontent.com/crabsatellite/Urushi-MOD-1.21.1-Neoforge/1.21.1/updates.json"
logoFile="logo.png"

authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[modproperties.${mod_id}]
    catalogueItemIcon="urushi:kasuga_lantern"
